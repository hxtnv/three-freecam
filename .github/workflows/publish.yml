name: publish

on:
  release:
    types: [published]

jobs:
  # A release never ships without the full matrix going green first.
  ci:
    uses: ./.github/workflows/ci.yml

  npm:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci

      # The tag and package.json must agree, otherwise the release notes point at
      # a version nobody can install.
      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      # Releases are also created retroactively for versions that already shipped, and
      # a re-run of a release is not unusual. Neither should fail the workflow.
      - name: Check whether this version is already on npm
        id: published
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "three-freecam@$version" version >/dev/null 2>&1; then
            echo "three-freecam@$version is already on npm, nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.published.outputs.skip == 'false'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
